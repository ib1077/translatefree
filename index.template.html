<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f6f2"><title>智頭線 ダイヤ図</title><!-- MANIFEST --><!-- STYLE --></head>
<body><header><div class="heading"><h1>智頭線 <span>ダイヤ図</span></h1><span id="source-caption">元Excel ① 着発時刻</span></div><div class="legend" aria-label="線の色"><span><i style="--ink:#be3438"></i>上り</span><span><i style="--ink:#285eba"></i>下り</span><span><i style="--ink:#00a5d9"></i>はくと</span><span><i style="--ink:#ddb900"></i>いなば</span></div></header>
<main><div class="toolbar"><div class="time-controls"><button id="prev" aria-label="前の時間帯">←</button><label>開始 <select id="start"></select></label><label>表示 <select id="span"><option value="10800">3時間</option><option value="21600">6時間</option><option value="64800">全日</option></select></label><button id="next" aria-label="次の時間帯">→</button></div><div class="filters"><label><input id="up" type="checkbox" checked>上り</label><label><input id="down" type="checkbox" checked>下り</label><label>列車 <select id="train"><option value="">すべて</option></select></label><button id="expand">全画面</button></div></div>
<div class="chart-wrap" id="chart-wrap"><svg id="chart" role="img" aria-label="時刻と駅距離による列車ダイヤ図"></svg></div>
<div class="under"><p id="summary" aria-live="polite"></p><p>横線は着発間の停車。列車の線・番号を選ぶと時刻を表示。</p></div>
<section id="details" hidden aria-label="列車の着発時刻"><div class="detail-heading"><h2 id="detail-title"></h2><button id="close-detail">閉じる</button></div><p id="detail-note"></p><div class="table-wrap"><table><thead><tr><th>駅・信号所</th><th>距離 km</th><th>元欄</th><th>時刻</th><th>元セル</th></tr></thead><tbody id="detail-body"></tbody></table></div></section>
<details class="settings"><summary>データ・使い方</summary><p>時刻は元Excelの①だけを使用しています。②③の紙時刻表用変換は含みません。岩木と各駅の距離を保ち、空白時刻は補わず前後の点を結びます。着のない発欄は通過時刻の可能性があり、停車とは断定しません。</p><p>3時間表示で10分ごとの薄い線を確認できます。スマホは横向きにすると見やすくなります。全日は全体確認用です。</p><p id="source-info"></p><p id="offline-status"></p><label class="import">新しいデータ（JSON）を開く <input id="import-data" type="file" accept=".json,application/json"></label><button id="reset-data">同梱データへ戻す</button><p id="import-message" aria-live="polite"></p><p>読み込んだJSONはこの端末に保存します。保存できない環境では画面上でお知らせします。</p></details></main>
<script id="diagram-data" type="application/json">__DATA__</script><!-- APP --><!-- REGISTER --></body></html>
