<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#17324d"><title>駅案内 翻訳試作</title><link rel="manifest" href="manifest.webmanifest">
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#17202a;background:#eef2f5}*{box-sizing:border-box}body{margin:0}header{background:#17324d;color:white;padding:14px 16px;position:sticky;top:0;z-index:2}header b{font-size:19px}.wrap{max-width:760px;margin:auto;padding:12px}.card{background:white;border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 2px 8px #0001}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}button,select,input,textarea{font:inherit}button{border:0;border-radius:10px;padding:12px 14px;background:#e5ebf0;color:#14202b;font-weight:700}button.primary{background:#17324d;color:white}button.mic{font-size:20px;min-width:135px}button:disabled{opacity:.45}textarea{width:100%;min-height:110px;border:1px solid #bdc8d1;border-radius:10px;padding:10px;font-size:17px;line-height:1.5}label{font-weight:700}.small{font-size:13px;color:#52616d}.status{padding:9px;border-radius:8px;background:#eef4f8;margin-top:8px}.good{background:#e8f5e9}.warn{background:#fff4df}.tabs button.active{background:#17324d;color:white}.history{border-top:1px solid #ddd;padding:9px 0}.history small{color:#667}.switch{display:flex;gap:6px}.switch button{flex:1}.dictgrid{display:grid;grid-template-columns:1fr 1fr auto;gap:6px;margin-top:8px}.dictgrid input{min-width:0;border:1px solid #bdc8d1;border-radius:8px;padding:8px}@media(max-width:520px){.dictgrid{grid-template-columns:1fr 1fr}.dictgrid button{grid-column:1/3}}
</style></head>
<body><header><b>駅案内 翻訳試作</b><div class="small" style="color:#dce6ef">Pixel / Android / Chrome 実機確認用</div></header>
<div class="wrap">
<div class="card"><div class="switch"><button id="jaBtn" class="active">日本語 → English</button><button id="enBtn">English → 日本語</button></div></div>
<div class="card"><div class="row"><button id="micBtn" class="primary mic">🎤 話す</button><button id="stopBtn" disabled>■ 停止</button><label><input id="localOnly" type="checkbox"> 端末内認識を要求</label></div><div id="speechStatus" class="status">音声認識をまだ開始していません。</div><textarea id="input" placeholder="ここに入力、またはマイクで話します"></textarea><div class="row"><button id="correctBtn">駅名補正</button><button id="copyIn">コピー</button><button id="clearBtn">クリア</button></div></div>
<div class="card"><label>翻訳結果（試作では手入力可）</label><textarea id="output" placeholder="この版は翻訳エンジン未接続です。まず音声認識・固有名詞補正・PWA動作を確認します。"></textarea><div class="row"><button id="speakBtn">🔊 読み上げ</button><button id="copyOut">コピー</button><button id="saveBtn">★ 会話保存</button></div><p class="small">翻訳APIはまだ接続していません。APIキーをGitHub Pages内へ置かないためです。</p></div>
<div class="card"><div class="row"><b>端末内音声認識 診断</b><button id="diagBtn">診断する</button><button id="installBtn">言語パック導入</button></div><div id="diag" class="status">未診断</div><p class="small">端末内認識関連APIは実験的です。使えない場合も通常のWeb Speech音声認識を試せます。</p></div>
<div class="card"><b>駅名・鉄道用語辞書</b><p class="small">認識後の文字を補正します。端末内だけに保存します。</p><div id="dict"></div><div class="dictgrid"><input id="from" placeholder="誤認識/日本語"><input id="to" placeholder="正しい表記"><button id="addDict">追加</button></div></div>
<div class="card"><div class="row"><b>会話履歴</b><button id="eraseHistory">履歴削除</button></div><div id="history"></div></div>
</div>
<script>
const $=id=>document.getElementById(id);let source='ja-JP';let target='en-US';let recognition=null;
const defaultDict=[['地図駅','智頭駅'],['地図','智頭'],['ちず駅','智頭駅'],['ちず','智頭'],['上郡駅','上郡駅'],['さよ駅','佐用駅'],['大原駅','大原駅'],['スーパー白兎','スーパーはくと'],['スーパー白と','スーパーはくと']];
let dict=JSON.parse(localStorage.getItem('railDict')||'null')||defaultDict;let history=JSON.parse(localStorage.getItem('railHistory')||'[]');
function persist(){localStorage.setItem('railDict',JSON.stringify(dict));localStorage.setItem('railHistory',JSON.stringify(history))}
function renderDict(){ $('dict').innerHTML=dict.map((d,i)=>`<div class="dictgrid"><input value="${esc(d[0])}" data-i="${i}" data-k="0"><input value="${esc(d[1])}" data-i="${i}" data-k="1"><button data-del="${i}">削除</button></div>`).join('');document.querySelectorAll('#dict input').forEach(x=>x.onchange=e=>{dict[+e.target.dataset.i][+e.target.dataset.k]=e.target.value;persist()});document.querySelectorAll('[data-del]').forEach(x=>x.onclick=e=>{dict.splice(+e.target.dataset.del,1);persist();renderDict()})}
function renderHistory(){ $('history').innerHTML=history.length?history.map((h,i)=>`<div class="history"><small>${new Date(h.t).toLocaleString()} ${h.dir}</small><div>${esc(h.a)}</div><div><b>${esc(h.b)}</b></div></div>`).join(''):'<p class="small">まだありません。</p>'}
function esc(s=''){return s.replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function correct(){let s=$('input').value;for(const [a,b] of dict){if(a)s=s.split(a).join(b)}$('input').value=s}
function setDir(ja){source=ja?'ja-JP':'en-US';target=ja?'en-US':'ja-JP';$('jaBtn').classList.toggle('active',ja);$('enBtn').classList.toggle('active',!ja);$('input').placeholder=ja?'日本語を入力、または話します':'Type or speak English';}
$('jaBtn').onclick=()=>setDir(true);$('enBtn').onclick=()=>setDir(false);$('correctBtn').onclick=correct;$('clearBtn').onclick=()=>{$('input').value='';$('output').value=''};
async function cp(el){try{await navigator.clipboard.writeText($(el).value)}catch{}}$('copyIn').onclick=()=>cp('input');$('copyOut').onclick=()=>cp('output');
$('speakBtn').onclick=()=>{speechSynthesis.cancel();let u=new SpeechSynthesisUtterance($('output').value);u.lang=target;speechSynthesis.speak(u)};
$('saveBtn').onclick=()=>{if(!$('input').value&&!$('output').value)return;history.unshift({t:Date.now(),dir:source.startsWith('ja')?'日→英':'英→日',a:$('input').value,b:$('output').value});history=history.slice(0,50);persist();renderHistory()};
$('eraseHistory').onclick=()=>{history=[];persist();renderHistory()};$('addDict').onclick=()=>{if(!$('from').value||!$('to').value)return;dict.push([$('from').value,$('to').value]);$('from').value=$('to').value='';persist();renderDict()};
function SR(){return window.SpeechRecognition||window.webkitSpeechRecognition}
async function startSpeech(){const C=SR();if(!C){$('speechStatus').textContent='このブラウザーではSpeechRecognitionが見つかりません。';return}recognition=new C();recognition.lang=source;recognition.continuous=true;recognition.interimResults=true;recognition.maxAlternatives=1;if('processLocally' in recognition)recognition.processLocally=$('localOnly').checked;
try{if('phrases' in recognition&&window.SpeechRecognitionPhrase){let words=['智頭','智頭駅','上郡','上郡駅','佐用','佐用駅','大原','大原駅','スーパーはくと','智頭急行'];recognition.phrases=words.map(x=>new SpeechRecognitionPhrase(x,8));}}catch(e){}
let finalText='';recognition.onstart=()=>{$('speechStatus').textContent='聞いています…';$('speechStatus').className='status good';$('micBtn').disabled=true;$('stopBtn').disabled=false};recognition.onresult=e=>{let interim='';for(let i=e.resultIndex;i<e.results.length;i++){let t=e.results[i][0].transcript;if(e.results[i].isFinal)finalText+=t;else interim+=t}$('input').value=finalText+interim};recognition.onerror=e=>{$('speechStatus').textContent='音声認識エラー: '+e.error;$('speechStatus').className='status warn'};recognition.onend=()=>{correct();$('micBtn').disabled=false;$('stopBtn').disabled=true;if(!$('speechStatus').textContent.startsWith('音声認識エラー')){$('speechStatus').textContent='認識終了。駅名補正を適用しました。';$('speechStatus').className='status'}};try{recognition.start()}catch(e){$('speechStatus').textContent='開始できません: '+e.message}}
$('micBtn').onclick=startSpeech;$('stopBtn').onclick=()=>recognition&&recognition.stop();
async function diagnose(){const C=window.SpeechRecognition;if(!C){$('diag').innerHTML='端末内認識用の <code>SpeechRecognition</code> API が見つかりません。通常音声認識はマイクボタンで別途確認できます。';return}if(typeof C.available!=='function'){$('diag').textContent='available() 非対応。端末内認識の自動診断はできません。';return}try{let r=await C.available({langs:[source],processLocally:true,quality:'dictation'});$('diag').textContent=`${source}: ${r}（availableなら端末内で利用可能）`}catch(e){$('diag').textContent='診断エラー: '+e.message}}
$('diagBtn').onclick=diagnose;$('installBtn').onclick=async()=>{const C=window.SpeechRecognition;if(!C||typeof C.install!=='function'){ $('diag').textContent='install() 非対応です。';return}try{$('diag').textContent='言語パックを確認・導入中…';let ok=await C.install({langs:[source],processLocally:true,quality:'dictation'});$('diag').textContent=ok?'導入できました。もう一度診断してください。':'導入できませんでした。'}catch(e){$('diag').textContent='導入エラー: '+e.message}};
renderDict();renderHistory();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js');
</script></body></html>
